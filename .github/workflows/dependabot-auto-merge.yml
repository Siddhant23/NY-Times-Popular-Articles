name: Dependabot Auto Merge

# `pull_request` (not `pull_request_target`): GitHub now blocks `pull_request_target`
# by default on public repos, and it ran with write access on PR events from anyone.
# For PRs opened by Dependabot, the `permissions` below are granted to GITHUB_TOKEN
# even on `pull_request`, which is the pattern GitHub documents for auto-merge.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Check the PR author, not github.actor: a human re-running the job would
    # otherwise skip it, and the actor can differ from who opened the PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only patch and minor bumps are auto-merged; majors need a human.
      # `--auto` waits for CI only if master requires status checks
      # (branch protection); without them it merges immediately.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
