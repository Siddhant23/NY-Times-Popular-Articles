name: Test

on:
  push:
    branches: [ workflow-github, master ]
    paths-ignore:
      - '*.md'
  # No paths-ignore on PRs: if this check is required by branch protection,
  # a docs-only PR would otherwise wait forever for a check that never runs.
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    # Check name used by branch protection: "test (API 29)".
    name: test (API ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # API 37 (targetSdk) is new on hosted emulators, so it is non-blocking until it
    # has been green a few times; then drop `experimental` and require its check.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            label: 29
            target: default
            arch: x86
            experimental: false
          # Android 17 SDK packages use minor-version names (platforms;android-37.0,
          # system-images;android-37.0;google_apis;x86_64). Keep it quoted: unquoted,
          # YAML turns 37.0 into 37 and sdkmanager can't find 'platforms;android-37'.
          - api-level: '37.0'
            label: 37
            target: google_apis
            arch: x86_64
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # JVM checks don't depend on the emulator, so run them once (API 29 leg).
      - name: Unit tests and lint
        if: matrix.api-level == 29
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace --continue -Dorg.gradle.workers.max=2

      - name: Enable KVM for Linux runners
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests (API ${{ matrix.label }})
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: Galaxy Nexus
          cores: 2
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace -Dorg.gradle.workers.max=2

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-api${{ matrix.label }}-${{ matrix.target }}
          path: |
            **/build/reports/*
            **/build/outputs/*/connected/*
