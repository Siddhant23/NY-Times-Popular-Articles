name: Build

on:
  push:
    branches:
      - workflow-github
      - master
    paths-ignore:
      - '*.md'
  # No paths-ignore on PRs: if this check is required by branch protection,
  # a docs-only PR would otherwise wait forever for a check that never runs.
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The release APK is unsigned (no signing config). NYT_API_KEY is optional:
      # without the repo secret the build still succeeds and only logs a warning.
      - name: Build release APK
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: ./gradlew :app:assembleRelease --stacktrace
