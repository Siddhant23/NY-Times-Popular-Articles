name: Delete old workflow runs

# Weekly instead of on every push, and 30 days of history by default, so there is
# enough CI history to see when master broke.
on:
  schedule:
    - cron: '30 3 * * 1' # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:
    inputs:
      days:
        description: 'Keep runs from the last N days.'
        required: true
        default: "30"

permissions:
  actions: write

jobs:
  del_runs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.days || 30 }}
